name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2025.8.0'
            python: '3.13'
            requirements: requirements-ci/ha-minimum.txt
          - ha: '2026.8.0'
            python: '3.14'
            requirements: requirements-ci/ha-current.txt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned HA test dependencies
        run: python -m pip install -r '${{ matrix.requirements }}'
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
